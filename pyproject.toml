[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-behaviour-segmentation"
version = "1.0.0"
description = "Customer segmentation with probabilistic membership and temporal stability analysis"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "openpyxl"]

[project.optional-dependencies]
notebook = ["jupyterlab", "nbclient", "nbconvert", "ipykernel"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
